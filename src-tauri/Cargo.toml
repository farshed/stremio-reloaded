[package]
name = "stremio-shell"
version = "4.4.183"
description = "Stremio desktop shell"
edition = "2021"
rust-version = "1.80"

[lib]
name = "stremio_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.6"
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-log = "2.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keepawake = "0.6"
url = "2"
libmpv2-sys = "4.0"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSColor", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAOpenGLLayer", "CAMediaTiming", "objc2-open-gl", "objc2-core-foundation", "objc2-core-video"] }
objc2-open-gl = { version = "0.3", features = ["CGLTypes", "CGLCurrent"] }
objc2-core-foundation = { version = "0.3", features = ["CFDate"] }
objc2-core-video = { version = "0.3", features = ["CVBase"] }
dispatch2 = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
strip = true
